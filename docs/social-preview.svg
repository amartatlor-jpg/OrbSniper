<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="OrbSniper">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc352"/>
      <stop offset="0.55" stop-color="#ffab1a"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffab1a" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffab1a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffab1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#08090c"/>

  <g stroke="#141821" stroke-width="1">
    <path d="M0 80h1280M0 160h1280M0 240h1280M0 320h1280M0 400h1280M0 480h1280M0 560h1280"/>
    <path d="M80 0v640M160 0v640M240 0v640M320 0v640M960 0v640M1040 0v640M1120 0v640M1200 0v640"/>
  </g>

  <!-- reticle -->
  <g transform="translate(258 320)">
    <circle r="150" fill="url(#glow)"/>
    <g stroke="#333944" stroke-width="2.5" fill="none">
      <circle r="120"/>
      <circle r="88" stroke-dasharray="3 10" opacity="0.75"/>
    </g>
    <g stroke="#ffab1a" stroke-width="6" stroke-linecap="round">
      <path d="M0 -136v42M0 94v42M-136 0h42M94 0h42"/>
    </g>
    <g stroke="#4a5261" stroke-width="3.5" stroke-linecap="round">
      <path d="M-38 -58h15M-38 -30h15M-38 -2h15M-38 26h15M-38 54h15"/>
    </g>
    <circle r="42" fill="url(#amber)"/>
    <circle r="42" fill="url(#sheen)"/>
    <circle r="14" fill="#08090c" opacity="0.26"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(470 0)">
    <text x="0" y="252" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="104" font-weight="700" letter-spacing="-3"
          fill="#f2f4f7">Orb<tspan fill="url(#amber)">Sniper</tspan></text>

    <text x="5" y="308" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="32" font-weight="600" fill="#e6edf3">Farm Discord Orbs while you are away</text>

    <text x="5" y="352" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="24" font-weight="400" fill="#98a1ae">Auto-completes Quests. Trade Orbs for Nitro and decorations.</text>

    <g transform="translate(5 392)">
      <rect width="140" height="42" rx="10" fill="#15181e" stroke="#23272f" stroke-width="1.5"/>
      <text x="70" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
            font-size="17" font-weight="600" fill="#98a1ae">no token</text>

      <rect x="154" width="172" height="42" rx="10" fill="#15181e" stroke="#23272f" stroke-width="1.5"/>
      <text x="240" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
            font-size="17" font-weight="600" fill="#98a1ae">10 languages</text>

      <rect x="335" width="168" height="42" rx="10" fill="#15181e" stroke="#23272f" stroke-width="1.5"/>
      <text x="419" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
            font-size="17" font-weight="600" fill="#98a1ae">open source</text>

      <rect x="512" width="110" height="42" rx="10" fill="#2a1f08" stroke="#5c4413" stroke-width="1.5"/>
      <text x="567" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
            font-size="17" font-weight="700" fill="#ffab1a">free</text>
    </g>

    <text x="5" y="492" font-family="Consolas, Cascadia Mono, monospace"
          font-size="20" fill="#4a5261">github.com/syntaxixr/OrbSniper</text>
  </g>
</svg>
